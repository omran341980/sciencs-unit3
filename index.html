<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منصة اختبارات الجماعات الحيوية – موهبة</title>
<style>
:root{--bg:#f6f4fb;--card:#fff;--tx:#1f1b2e;--mu:#6b6580;--pr:#5b3fa0;--ok:#1a7f4b;--okb:#e3f5ea;--no:#b3261e;--nob:#fbe7e5;--bd:#ddd6ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17141f;--card:#221e2e;--tx:#efeaf9;--mu:#a69fbb;--pr:#a68cf0;--ok:#6fdc9f;--okb:#17352a;--no:#ff9b94;--nob:#3d1f1d;--bd:#3a3450}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.8}
main{max-width:720px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px}
h1{font-size:1.4rem;margin:0 0 6px;color:var(--pr)}h2{font-size:1.1rem;margin:0 0 8px}
input{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;font-size:1rem;background:var(--bg);color:var(--tx)}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:11px 18px;background:var(--pr);color:#fff;margin:4px 0}
button.s{background:transparent;color:var(--pr);border:1px solid var(--pr)}
.opt{display:block;width:100%;text-align:right;background:var(--bg);color:var(--tx);border:1px solid var(--bd);margin:6px 0}
.opt.ok{background:var(--okb);border-color:var(--ok);color:var(--ok)}.opt.no{background:var(--nob);border-color:var(--no);color:var(--no)}
.fb{padding:12px;border-radius:10px;margin-top:10px}.fb.ok{background:var(--okb)}.fb.no{background:var(--nob)}
.tag{display:inline-block;font-size:.8rem;background:var(--bd);border-radius:20px;padding:0 10px;color:var(--mu)}
.bar{height:8px;background:var(--bd);border-radius:8px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--pr)}
.mu{color:var(--mu);font-size:.9rem}.err{color:var(--no)}textarea{width:100%;height:150px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:8px}
</style></head><body><main id="app"></main>
<script>
const TEACHER="محمد صلاح الدين عمران",MAIL="momran1985@gmail.com";
// [السؤال، [الخيارات]، رقم الصحيحة، التغذية الراجعة، مستوى التفكير]
const SECTIONS=[
{t:"النشاط الأول: قياس تعداد الجماعات الحيوية",q:[
["أُخذت 5 مربعات مساحة كل منها 1 م² من حقل مساحته 400 م²، وكانت أعداد النباتات: 12، 8، 10، 14، 6. ما التقدير الأفضل لعدد النباتات في الحقل؟",["400","2000","4000","50"],2,"المتوسط = 50 ÷ 5 = 10 نباتات/م²، ثم 10 × 400 = 4000. نضرب كثافة العينة في المساحة الكلية.","تطبيق"],
["وُسم 40 حيواناً وأُطلقوا. في العينة الثانية (50 حيواناً) وُجد 10 موسومة. ما حجم الجماعة المقدّر؟",["125","160","200","500"],2,"العدد = (الموسوم الأول × حجم العينة الثانية) ÷ الموسوم المستعاد = 40×50÷10 = 200.","تطبيق"],
["وُسم 60 حيواناً، وفي العينة الثانية (30 حيواناً) كان 6 موسومة. كم عدد الجماعة؟",["180","300","360","600"],1,"60×30÷6 = 300. النسبة 6/30 = 1/5 تعني أن الموسومين خُمس الجماعة.","تطبيق"],
["إذا سقطت العلامات عن كثير من الحيوانات الموسومة قبل العينة الثانية، فإن التقدير سيكون:",["أقل من الحقيقي","أكبر من الحقيقي","مطابقاً للحقيقي","غير ممكن الحساب"],1,"سقوط العلامات يقلّل عدد الموسومين المستعادين (المقام)، فيكبر الناتج ويصبح التقدير مبالغاً فيه.","تحليل"],
["إذا أصبحت الحيوانات الموسومة «تُحب» الوقوع في الفخاخ (أكثر عرضة للالتقاط)، فما أثر ذلك في التقدير؟",["يزيد التقدير","يقلّ التقدير","لا يتغير","يصبح صفراً"],1,"زيادة الموسومين في العينة الثانية تكبّر المقام فيصغر الناتج، فيُقدَّر العدد بأقل من الحقيقة.","تقويم"],
["لماذا يجب اختيار مواقع المربعات القياسية عشوائياً؟",["لتوفير الوقت","لتجنب التحيّز ولتمثّل العينة الجماعة","لزيادة عدد النباتات المعدودة","لأن المربعات العشوائية أصغر"],1,"الاختيار العشوائي يمنع الباحث من اختيار الأماكن الكثيفة فقط، فتكون النتائج قابلة للتعميم.","تحليل"],
["تريد تقدير أعداد طيور مختبئة في غابة كثيفة يصعب رؤيتها. أي تصميم أنسب؟",["عدّ الطيور المرئية من الطريق فقط","تسجيل أصواتها ضمن نقاط عشوائية وتكراره عدة مرات مع تدوين الظروف","سؤال السكان المحليين عن رأيهم","عدّ الأعشاش في شجرة واحدة"],1,"الطريقة غير المباشرة (الصوت) مع تكرار القياس وعشوائية المواقع تعطي بيانات أدق وأقل تحيّزاً.","تركيب"],
["لماذا يجب ألا تؤثر طريقة الوسم في بقاء الحيوان أو قابليته للاصطياد؟",["لأن الوسم مكلف","لأن ذلك يخلّ بافتراض أن الموسومين يمثّلون الجماعة كلها","لأن الحيوان قد يتغذى أكثر","لا علاقة لذلك بالدقة"],1,"تعتمد الطريقة على افتراض أن الموسوم يتصرف كغيره؛ وإلا فإن النسبة لا تعبّر عن الجماعة.","تقويم"]]},
{t:"النشاط الثاني: جماعات حيوية في خطر",q:[
["في منحنى المفترس والفريسة، لماذا يتأخر ذروة المفترس عن ذروة الفريسة؟",["لأن المفترس أبطأ حركة","لأن تكاثر المفترس يعتمد على وفرة غذائه فيتبع تزايد الفريسة","لأن الفريسة تقتل المفترس","بسبب الصدفة فقط"],1,"زيادة الفريسة توفّر غذاء للمفترس فيزداد بعدها، ثم تقلّ الفريسة بسبب افتراسه فتتراجع أعداده.","تحليل"],
["ما المتوقع عند إزالة المفترسات من نظام بيئي؟",["تبقى الفريسة ثابتة","تزداد الفريسة ثم يحدّها نقص الغذاء أو المرض","تنقرض الفريسة","يزداد الغذاء دائماً"],1,"من دون مفترس تزداد الفريسة حتى تصطدم بعوامل أخرى كالغذاء والأمراض (السعة الاستيعابية).","تحليل"],
["لماذا يُعدّ انخفاض أعداد النحل خطراً على الإنسان؟",["لأن العسل سيقلّ فقط","لأن النحل يلقّح محاصيل غذائية كثيرة فيتأثر الإنتاج الزراعي","لأن النحل يأكل الآفات","لأنه يحسّن الجو"],1,"التلقيح خدمة بيئية تدعم إنتاج الفواكه والخضروات، فتراجعه يهدد الأمن الغذائي.","تقويم"],
["أي تصميم أنسب لاختبار أثر مبيد معين في اضطراب انهيار الخلايا؟",["ملاحظة خلية واحدة معرّضة للمبيد","مجموعة خلايا معرّضة وأخرى ضابطة بظروف متماثلة وتكرار التجربة","سؤال المزارعين فقط","قياس الحرارة وحدها"],1,"وجود مجموعة ضابطة وتكرار التجربة يعزل أثر المتغير المدروس عن بقية العوامل.","تركيب"],
["أي العوامل التالية معتمد على الكثافة؟",["حريق غابات","جفاف شديد","انتشار مرض معدٍ","زلزال"],2,"المرض ينتشر أسرع كلما ازدحمت الجماعة، أما الحريق والجفاف فيؤثران بغض النظر عن الكثافة.","تصنيف"],
["عندما يتساوى حجم الجماعة تقريباً مع السعة الاستيعابية للبيئة فإن منحناها:",["ينهار فجأة","يستقر حول قيمة تقريباً ثابتة","يرتفع بلا حد","يصبح سالباً"],1,"عند السعة الاستيعابية تتوازن الولادات مع الوفيات بسبب محدودية الموارد.","فهم"],
["قال أحدهم: «انخفض النحل بعد استخدام المبيد الجديد، إذاً المبيد هو السبب». ما أفضل نقد لهذا الاستنتاج؟",["صحيح تماماً","الاقتران الزمني لا يثبت السببية؛ قد توجد عوامل أخرى كالطفيليات والأمراض","لا يمكن الاستنتاج من أي بيانات","المبيدات لا تؤثر أبداً"],1,"الارتباط لا يعني السببية، ويلزم ضبط المتغيرات الأخرى أو إجراء تجربة محكمة.","تفكير ناقد"],
["جماعتان: إحداهما تتعرض لمفترس ومرض ونقص غذاء، والأخرى لنقص غذاء فقط. أيهما أكثر عرضة للانهيار ولماذا؟",["الثانية لأن الغذاء أهم","الأولى لتعدد الضغوط المتراكبة","كلاهما بالقدر نفسه دائماً","لا يمكن المقارنة بأي حال"],1,"تراكم عدة عوامل مُحدِّدة يضاعف التأثير ويقلّل فرص التعافي.","تقويم"]]},
{t:"النشاط الثالث: الجماعات البشرية والهرم السكاني",q:[
["هرم سكاني ذو قاعدة عريضة وقمة ضيقة يدل على:",["شيخوخة المجتمع","نمو سكاني سريع وغلبة فئة الأطفال","تناقص حاد في الولادات","استقرار السكان"],1,"القاعدة العريضة تعني ولادات كثيرة وأعداداً كبيرة من الصغار، فيتوقع استمرار النمو.","تفسير"],
["هرم قاعدته ضيقة ووسطه وقمته أعرض نسبياً يدل على:",["مجتمع فتي جداً","مجتمع يتجه إلى الشيخوخة وتراجع الولادات","مجتمع بلا وفيات","هجرة الأطفال فقط"],1,"قلة الأطفال وزيادة كبار السن تشير إلى انخفاض الخصوبة وارتفاع متوسط الأعمار.","تفسير"],
["معدل المواليد 30 والوفيات 10 لكل 1000 سنوياً. كم تبلغ الزيادة الطبيعية لدولة سكانها 50 مليوناً (دون هجرة)؟",["مليون نسمة","مليونان","200 ألف","مليار"],0,"30−10 = 20 لكل 1000 = 2%، و2% من 50 مليوناً = 1 مليون نسمة سنوياً.","تطبيق"],
["لماذا تختلف توقعات الأمم المتحدة (مرتفع/متوسط/منخفض) لعدد سكان العالم؟",["أخطاء حسابية","اختلاف الافتراضات حول الخصوبة والوفيات والهجرة مستقبلاً","اختلاف الأقمار الاصطناعية","لأن الإحصاءات تُجرى مرة واحدة"],1,"التوقعات سيناريوهات قائمة على افتراضات، وأي تغيّر في الخصوبة يغيّر الناتج كثيراً بمرور العقود.","تحليل"],
["لماذا نما سكان البلدان النامية أسرع من المتقدمة في القرن العشرين؟",["لانخفاض الوفيات مع بقاء المواليد مرتفعة","لانخفاض المواليد فقط","لزيادة الهجرة من الدول المتقدمة","لانعدام الأمراض"],0,"تحسّن الرعاية الصحية خفّض الوفيات سريعاً بينما بقيت الخصوبة عالية فاتسعت الفجوة.","تحليل"],
["مؤشر إنتاج الغذاء للفرد في أفريقيا أقل منه في العالم. ما التوصية الأنسب لصانعي القرار؟",["لا إجراء مطلوب","تحسين الإنتاج الزراعي والتخزين والتوزيع مع الاهتمام بالتخطيط السكاني","منع الزراعة","زيادة الاستيراد للأبد دون حلول محلية"],1,"المشكلة متعددة الأسباب (إنتاج، توزيع، نمو سكاني)، فالحل يكون متكاملاً.","تقويم"],
["يظهر في هرم بلد ما نقص واضح في الذكور من فئة عمرية محددة. أي تفسير أرجح؟",["أخطاء عشوائية في الرسم","حدث تاريخي مثل حرب أو هجرة انتقائية أثّر في تلك الفئة","زيادة الولادات","انتشار الكسل"],1,"الفجوات المحددة في فئة جنسية وعمرية تشير غالباً إلى أحداث كالحروب أو هجرة العمال.","تحليل"],
["دولة هرمها يشير إلى شيخوخة متسارعة. أي حزمة سياسات تقترح؟",["لا شيء","تشجيع الإنجاب المدروس مع تطوير الرعاية الصحية والتقاعد واستقطاب كفاءات","منع الهجرة ومنع الإنجاب","زيادة الضرائب فقط"],1,"المعالجة تتطلب أدوات متكاملة تعالج السبب (الخصوبة) والنتيجة (احتياجات كبار السن).","تركيب"]]}
];
let S={name:"",sec:null,i:0,score:0,log:[],done:false,res:{}};
const $=document.getElementById("app");
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function login(err){
$.innerHTML=`<div class="card"><h1>منصة اختبارات الجماعات الحيوية</h1><p class="mu">الصف الثالث المتوسط – موهبة<br>المعلم المتابع: ${TEACHER}</p>
<label>اكتب اسمك الثلاثي:</label><input id="nm" placeholder="الاسم الأول واسم الأب واسم الجد" value="${esc(S.name)}">
${err?`<p class="err">${err}</p>`:""}<button onclick="go()">دخول</button></div>`}
function go(){const v=document.getElementById("nm").value.trim().replace(/\s+/g," ");
if(v.split(" ").length<3)return login("يرجى كتابة الاسم الثلاثي كاملاً.");S.name=v;menu()}
function menu(){
$.innerHTML=`<div class="card"><h1>مرحباً ${esc(S.name)}</h1><p class="mu">اختر نشاطاً لبدء الاختبار. تحصل على تغذية راجعة بعد كل سؤال.</p>
${SECTIONS.map((s,k)=>`<button class="opt" onclick="start(${k})"><b>${s.t}</b><br><span class="mu">${s.q.length} أسئلة${S.res[k]?` – نتيجتك: ${S.res[k].score}/${s.q.length}`:""}</span></button>`).join("")}
${Object.keys(S.res).length?`<button class="s" onclick="report()">عرض التقرير الكامل وإرساله للمعلم</button>`:""}</div>`}
function start(k){S.sec=k;S.i=0;S.score=0;S.log=[];quiz()}
function quiz(){
const s=SECTIONS[S.sec],q=s.q[S.i];
$.innerHTML=`<div class="card"><span class="tag">${q[4]}</span> <span class="mu">سؤال ${S.i+1} من ${s.q.length}</span>
<div class="bar"><i style="width:${S.i/s.q.length*100}%"></i></div><h2>${q[0]}</h2>
<div id="o">${q[1].map((o,j)=>`<button class="opt" onclick="ans(${j})">${o}</button>`).join("")}</div><div id="f"></div></div>`}
function ans(j){
const s=SECTIONS[S.sec],q=s.q[S.i],r=j===q[2];if(r)S.score++;S.log.push({l:q[4],r});
document.querySelectorAll("#o .opt").forEach((b,k)=>{b.disabled=true;if(k===q[2])b.classList.add("ok");else if(k===j)b.classList.add("no")});
const last=S.i===s.q.length-1;
document.getElementById("f").innerHTML=`<div class="fb ${r?"ok":"no"}"><b>${r?"إجابة صحيحة ✔":"إجابة غير صحيحة ✘"}</b><br>${q[3]}</div><button onclick="${last?"finish()":"nx()"}">${last?"إنهاء القسم":"السؤال التالي"}</button>`}
function nx(){S.i++;quiz()}
function finish(){S.res[S.sec]={score:S.score,log:S.log};report()}
function text(){
let t=`نتائج الطالب: ${S.name}\nالمعلم: ${TEACHER}\n\n`;
Object.keys(S.res).forEach(k=>{const r=S.res[k],n=SECTIONS[k].q.length,by={};
r.log.forEach(x=>{by[x.l]=by[x.l]||[0,0];by[x.l][1]++;if(x.r)by[x.l][0]++});
t+=`${SECTIONS[k].t}: ${r.score}/${n} (${Math.round(r.score/n*100)}%)\n  حسب المستوى: ${Object.entries(by).map(([a,b])=>a+" "+b[0]+"/"+b[1]).join("، ")}\n`});
return t}
function report(){
const t=text();
$.innerHTML=`<div class="card"><h1>تقرير النتائج</h1><pre style="white-space:pre-wrap;font:inherit">${esc(t)}</pre>
<a href="mailto:${MAIL}?subject=${encodeURIComponent("نتائج اختبار الجماعات الحيوية - "+S.name)}&body=${encodeURIComponent(t)}"><button>إرسال النتائج بالبريد إلى المعلم</button></a>
<button class="s" onclick="cp()">نسخ النتائج</button><button class="s" onclick="menu()">العودة للأنشطة</button><p class="mu" id="m">إن لم يفتح تطبيق البريد، انسخ النتائج وأرسلها إلى ${MAIL}</p></div>`}
function cp(){try{navigator.clipboard.writeText(text()).then(()=>m("تم النسخ."),()=>m("تعذّر النسخ، حدّد النص يدوياً."))}catch(e){m("تعذّر النسخ، حدّد النص يدوياً.")}}
function m(x){document.getElementById("m").textContent=x}
login();
</script></body></html>
